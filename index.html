<script>/* Lightweight flat-shaded mesh builder and shadow-mapped WebGL renderer. */

function viewMatrix(eye,at){

function ortho(w,h,n,f){return [1/w,0,0,0,0,1/h,0,0,0,0,-2/(f-n),0,0,0,-(f+n)/(f-n),1]}

uniform vec3 lightDir;
uniform float farm, weather, clock;
float saturate(float v) { return clamp(v, 0.0, 1.0); }
float hash2(vec2 p0) {
  vec3 a = fract(vec3(p0.xyx) * vec3(.1031,.1030,.0973));
  a += dot(a,a.yzx + 33.33);
  return fract((a.x+a.y)*a.z);

float noise2(vec2 xy) {

  f=f*f*(3.0-2.0*f);

}
vec3 horizonColor(vec3 ray, vec3 sun) {
  vec2 h = normalize(ray.xz + vec2(.00003,.00001));
  vec2 s = normalize(sun.xz + vec2(.00001,.00003));
  float facing = saturate(dot(h,s)*.5+.5);
  float bloom = pow(facing,3.5);
  vec3 cool = mix(vec3(.56,.57,.69),vec3(.75,.79,.80),farm);
  vec3 peach = mix(vec3(1.00,.61,.39),vec3(1.00,.81,.54),farm);
  vec3 horizon = mix(cool,peach,.12+.88*bloom);
  return mix(horizon,vec3(.68,.70,.73),saturate(weather)*.66);

vec3 skyBase(vec3 ray, vec3 sun) {
  float altitude = saturate(ray.y);
  vec3 rim = horizonColor(ray,sun);
  vec3 mid = mix(vec3(.39,.48,.66),vec3(.59,.74,.81),farm);
  vec3 zen = mix(vec3(.15,.24,.42),vec3(.28,.51,.69),farm);
  float w=saturate(weather);

  float luma=dot(display,vec3(.2126,.7152,.0722));

  // shoulder on pale bedding, sunlit grass and frosted lamp shades.

varying vec3 p,n,c;
varying vec2 m;
varying vec4 shadowP;
uniform vec3 eye;
uniform sampler2D shadowTex;
uniform float shadowOn;

vec3 directBRDF(vec3 albedo,vec3 f0,float metallic,float r,vec3 normal0,vec3 v,vec3 l,vec3 radiance) {

// A metropolitan skyline at real-world scale. The boulevard is 112 metres
// below the apartment. Every floor shares a datum, even across stepped towers.
function buildCity(g) {
  const street = -112;
  const rand = () => g.rand();
  const range = (lo,hi) => lo+(hi-lo)*rand();
  const pick = a => a[Math.floor(rand()*a.length)];
  const facades = {
    glass: [
      ['#435d70','#536e7e','#304958','#81949a'],
      ['#526877','#697e88','#364e5e','#a1a5a0'],
      ['#526071','#6d7784','#373f51','#9d98a0']
    ],
    stone: [
      ['#827b78','#aaa39a','#474955','#c6b6a3'],
      ['#747881','#98979b','#444956','#b2ada6'],
      ['#8b796b','#a99483','#4d4a50','#c2ae93']
    ],
    brick: [
      ['#745d58','#91766b','#443e44','#b39b85'],
      ['#686168','#887880','#413e4c','#9c9391']
    ]
  };
  const glassM = {mat:'metal'}, stoneM = {mat:'stone'};
  const lamps = [
    ['#d7b896','#dec6a0','#c1ac96','#eed2ac'],
    ['#b6c1bb','#d2ceaf','#aabcc1','#c3cdc7'],
    ['#cbb49a','#d4ae87','#b5a8a0','#e7c9a3']
  ];
  const light = {glow:.53}, blind = {glow:.32};
  const coldGlass = ['#506375','#495c6f','#465c6c','#617380','#596b76','#526472'];
  const dimGlass = ['#475463','#404d5c','#46535e','#4c545e'];
  const baseBox = (...a) => g.box(...a);
  const packet = (kind,colors) => ({kind, colors, lights:pick(lamps), lit:range(.22,.51)});

  // Clockwise in the horizontal plane. Each edge's outward normal is its
  // direction rotated left, allowing details to wrap chamfered corners.
  function footprint(x,z,w,d,cut) {
    const l=x-w/2,r=x+w/2,b=z-d/2,f=z+d/2;
    if (cut<.01) return [[l,f],[r,f],[r,b],[l,b]];
    return [[l+cut,f],[r-cut,f],[r,f-cut],[r,b+cut],[r-cut,b],[l+cut,b],[l,b+cut],[l,f-cut]];
  }
  function edge(a,b) {
    const w=Math.hypot(b[0]-a[0],b[1]-a[1]), ux=(b[0]-a[0])/w,uz=(b[1]-a[1])/w;
    return {x:a[0],z:a[1],w,ux,uz,nx:-uz,nz:ux};
  }
  function facadePanel(e,u,y,w,h,gap,col,opts) {
    const u0=u-w/2,u1=u+w/2,y0=y-h/2,y1=y+h/2;
    const x=e.x+e.nx*gap,z=e.z+e.nz*gap;
    const xl=x+e.ux*u0,zl=z+e.uz*u0,xr=x+e.ux*u1,zr=z+e.uz*u1;
    g.quad([xl,y0,zl],[xr,y0,zr],[xr,y1,zr],[xl,y1,zl],col,opts);
  }
  function madeVisible(e) {
    return -(e.x+e.w*.5*e.ux)*e.nx-(e.z+e.w*.5*e.uz)*e.nz>-4;
  }
  function cladding(e,bottom,top,building,dist,step) {
    const {kind,colors,lights,lit}=building, h=top-bottom;
    const glass=kind==='glass', near=dist<72, far=dist>112;
    const bays=Math.max(1,Math.round(e.w/(glass?2.05:2.65))), bay=e.w/bays;
    const deep=glass?coldGlass:dimGlass;
    const first=street+Math.ceil((bottom-street+1.9)/step)*step;
    for(let y=first;y<top-1.25;y+=step) {
      const seen=near||y>-63;
      const bandH=glass?step*.65:step*.53;
      if(glass) {
        // Continuous reflective glass ribbon behind the interior office lights.
        const bandColor=seen?pick(deep):deep[0];
        facadePanel(e,e.w/2,y,e.w-.10,bandH,.024,bandColor,glassM);
        if(near&&y>-50) facadePanel(e,e.w/2,y-bandH/2-.06,e.w-.09,.095,.052,colors[1],glassM);
      }
      if(!seen && rand()<.45) continue;
      let open=rand()<lit;
      const activeFloor=rand()>.17;
      for(let column=0;column<bays;) {
        if(rand()<.64) open=rand()<lit;
        const on=open&&activeFloor;
        const cluster=glass ? Math.min(bays-column,1+Math.floor(rand()*(far?4:near?2:3))) : 1;
        if(on || (!glass&&(!far||rand()<.4))) {
          const u=(column+cluster/2)*bay;
          const width=glass?cluster*bay-.18:bay*range(.5,.64);
          const color=on?pick(lights):pick(deep);
          const shade=on && near && rand()<.24;
          const shutter=shade?range(.35,.72):0;
          facadePanel(e,u,y-shutter*.5,width,bandH-shutter,.049,color,on?light:glassM);
          if(on&&near&&rand()<.20) {
            facadePanel(e,u,y+bandH*.28-shutter,width*.88,.095,.073,'#eee0bc',{glow:.76});
          } else if(!glass&&near&&rand()<.33) {
            facadePanel(e,u,y,width,.065,.073,colors[0],stoneM);
          }
        }
        column+=cluster;
      }
    }
    const fins=glass?bays:Math.round(e.w/5.3);
    if(!far||glass) for(let c=1;c<fins;c++) {
      const color=glass?colors[2]:colors[1];
      facadePanel(e,c*e.w/fins,(bottom+top)/2,glass?(near?.12:.18):.26,h-.13,.083,color,glass?glassM:stoneM);
    }
    if(!glass && near && e.w>8) {
      for(let y=top-11;y>bottom+3;y-=step*5) facadePanel(e,e.w/2,y,e.w,.23,.095,colors[1],stoneM);
    }
  }
  function block(x,z,w,d,bottom,top,chamfer,building,dist,step) {
    const outline=footprint(x,z,w,d,chamfer);
    const {colors,kind}=building;
    for(let i=0;i<outline.length;i++) {
      const a=outline[i], b=outline[(i+1)%outline.length], e=edge(a,b);
      facadePanel(e,e.w/2,(bottom+top)/2,e.w,top-bottom,0,colors[0],kind==='glass'?glassM:stoneM);
      if(madeVisible(e)) {
        if(e.w>2.1) cladding(e,bottom,top,building,dist,step);
        facadePanel(e,e.w/2,top-.18,e.w,.34,.10,colors[1],glassM);
        if(top>street+25 && e.w>4.5 && dist<115) {
          facadePanel(e,e.w/2,top-.55,e.w,.19,.07,colors[2],glassM);
        }
      }
      const mid=[(a[0]+b[0])/2,top,(a[1]+b[1])/2];
      g.quad([x,top,z],[a[0],top,a[1]],mid,[b[0],top,b[1]],colors[2],stoneM);
    }
  }

  function antenna(x,y,z,height) {
    const mast='#646974';
    g.cyl(x,y+height/2,z,.045,.16,height,6,mast,glassM);
    baseBox(x,y+height*.80,z,.95,.07,.09,mast,glassM);
    baseBox(x,y+height+.04,z,.16,.15,.16,'#ff846e',{glow:.89});
  }
  function roofServices(x,y,z,w,d) {
    const c=pick(['#6d7076','#757578','#78767a']);
    const rw=w*.34,rd=d*.31;
    baseBox(x-w*.12,y+1.0,z+d*.05,rw,2.0,rd,c,stoneM);
    for(let i=0;i<5;i++) {
      baseBox(x-w*.12,y+.39+i*.25,z+d*.05+rd/2+.04,rw*.77,.115,.07,'#434a52',glassM);
    }
    for(let i=0;i<2;i++) {
      const px=x+w*.23, pz=z+(i-.5)*d*.25;
      baseBox(px,y+.46,pz,w*.15,.92,d*.15,'#7b8081',glassM);
      g.cyl(px,y+.97,pz,Math.min(w,d)*.056,Math.min(w,d)*.056,.12,10,'#424c54');
    }
    if(rand()<.36) antenna(x-w*.12,y+2,z+d*.05,range(2.2,4.6));
  }
  function roofTank(x,y,z,r) {
    const legs=r*1.12, h=r*2.15;
    for(const a of [-.6,.6]) for(const b of [-.6,.6]) {
      baseBox(x+a*r,y+legs*.5,z+b*r,.12,legs,.12,'#454950',glassM);
    }
    g.cyl(x,y+legs+h/2,z,r,r,h,14,'#7a6b61',{mat:'wood'});
    for(const k of [.06,.28,.58,.87]) {
      g.cyl(x,y+legs+h*k,z,r+.03,r+.03,.075,14,'#45484b',glassM);
    }
    g.cyl(x,y+legs+h+r*.24,z,0,r*1.06,r*.48,14,'#626265',glassM);
  }
  function balconies(x,z,w,d,top,step) {
    const normal=Math.sign(-z)||1;
    const width=w*.32, cx=x-w*.20, face=z+normal*d*.5;
    for(let y=top-step*1.15;y>Math.max(street+5,top-45);y-=step) {
      const outside=face+normal*1.15;
      baseBox(cx,y,face+normal*.60,width,.21,1.35,'#a0998b',stoneM);
      baseBox(cx,y+.63,outside,width,1.03,.09,'#68767c',glassM);
      baseBox(cx,y+1.18,outside,width,.09,.13,'#a5a9a5',glassM);
      baseBox(cx+width/2-.08,y+.68,face+normal*.64,.13,1.22,1.15,'#807c78',stoneM);
    }
  }

  function tower(x,z,w,d,top,style,form) {
    const dist=Math.hypot(x,z);
    const skin=packet(style,pick(facades[style]));
    const step=style==='brick'?2.85:style==='stone'?3.00:3.25;
    const bevel=style==='glass' && rand()<.61 ? Math.min(w,d)*range(.09,.20) : 0;
    let y=top;
    if(form==='stepped') {
      const shoulder=top-range(8.0,13.2);
      block(x,z,w,d,street,shoulder,bevel,skin,dist,step);
      w*=.76;d*=.78;
      block(x,z,w,d,shoulder,top,bevel*.72,skin,dist,step);
    } else if(form==='deco') {
      let bottom=street;
      for(const [s,level] of [[1,top-17],[.79,top-8.5],[.57,top-3.6],[.34,top]]) {
        block(x,z,w*s,d*s,bottom,level,Math.min(w,d)*s*.14,skin,dist,step);
        bottom=level;
      }
      for(const [s,lo,hi] of [[.30,0,1.3],[.21,1.3,2.9],[.12,2.9,4.4]]) {
        g.cyl(x,top+(lo+hi)/2,z,w*s*.82,w*s,hi-lo,4,'#ac9987',{ry:Math.PI*.25,mat:'metal'});
      }
      antenna(x,top+4.4,z,7.2);
      return;
    } else {
      block(x,z,w,d,street,top,bevel,skin,dist,step);
    }
    if((style==='stone'||style==='brick')&&dist<80&&form!=='stepped'&&rand()<.64) balconies(x,z,w,d,top,step);
    if(dist<100) {
      if(style==='brick') roofTank(x+w*.16,y+.08,z-d*.10,Math.min(w,d)*.12);
      else roofServices(x,y,z,w,d);
    } else {
      baseBox(x,y+1.25,z,w*.33,2.5,d*.38,skin.colors[1],stoneM);
    }
  }

  // Near and middle landmarks establish a varied silhouette from the bed, the
  // desk and the corner glazing. The central northwest view opens to the sky.
  const landmarks=[
    [-38,12,15,19,-16,'stone','slab'],
    [-45,-21,13,18,7,'glass','stepped'],
    [-25,-49,14,14,-23,'brick','slab'],
    [19,-42,16,19,10,'glass','stepped'],
    [-7,-75,14,18,1,'stone','slab'],
    [33,-100,17,16,32,'stone','deco'],
    [-79,-69,16,18,20,'glass','stepped'],
    [-91,10,17,19,37,'glass','stepped'],
    [-78,43,14,14,14,'stone','deco'],
    [-37,-100,15,18,21,'glass','stepped'],
    [52,-72,16,20,18,'glass','slab']
  ];
  const blocks=[...landmarks];
  for(let ix=-6;ix<=5;ix++) for(let iz=-6;iz<=5;iz++) {
    const x=ix*24+range(-3.9,3.9),z=iz*24+range(-4,4);
    const dist=Math.hypot(x,z);
    if(dist<48||dist>153||(x>-17&&z>-18)||rand()<.17) continue;
    const w=range(9,18.5),d=range(10,20.5);
    if(blocks.some(b=>Math.abs(x-b[0])<(w+b[2])*.5+2.3 && Math.abs(z-b[1])<(d+b[3])*.5+2.3)) continue;
    const inSunsetGap = x<0&&z<0 && Math.abs(x/z-.82)<.27;
    const top=inSunsetGap?range(-42,-15):range(-40,dist>100?32:14);
    const style=pick(['glass','glass','glass','stone','stone','brick']);
    blocks.push([x,z,w,d,top,style,rand()<.42?'stepped':'slab']);
  }
  for(const args of blocks) tower(...args);

  // The south bank is a second, more distant skyline, behind the roof tanks
  // and office blocks on this side of the river. All silhouettes have depth.
  for(let row=0;row<2;row++)for(let i=-10;i<=10;i++){
    const x=i*21+range(-3,3),z=-181-row*48+range(-7,7);
    if(Math.abs(x+75)<19&&row===0)continue;
    const w=range(10,18),d=range(11,19),top=range(-41,26)+(row===1?7:0);
    tower(x,z,w,d,top,pick(['glass','stone','brick']),rand()<.45?'stepped':'slab');
  }
  tower(-75,-178,22,22,53,'stone','deco');
  // Aurora Exchange rises above the river with a tapered, triangulated crown.
  {
    const x=4,z=-173,w=20,d=16,top=39,p=packet('glass',facades.glass[1]);
    block(x,z,w,d,street,top,2.6,p,175,3.35);
    const low=footprint(x,z,w,d,2.6),peak=[x+4.3,top+17.8,z-1.4];

      g.polygon([b,a,peak],i%2?'#627984':'#495c73',glassM);
      g.beam(a,peak,.12,'#e4bd8e',{glow:.25,mat:'brass'});
    }
    antenna(peak[0],peak[1],peak[2],5.2);
  }

  // The street plane and lit traffic read through lower windows at acute angles.
  baseBox(0,street-.63,0,335,1,335,'#40464f',stoneM);
  for(let i=-5;i<=4;i++) {
    const a=i*24+12;
    baseBox(a,street-.104,0,5.25,.055,310,'#343b44');
    baseBox(0,street-.070,a,308,.055,5.25,'#353c46');
    for(let j=-5;j<=4;j++) {
      const b=j*24;

      baseBox(a-.77,street+.15,z,1.03,.38,1.96,pick(['#8c9292','#866d69','#4f626c']),{mat:'trafficZ'});
      baseBox(a-.77,street+.31,z-.96,.74,.12,.11,'#f6dbaf',{glow:.74,mat:'trafficZ'});
      if((i+j)%2===0) {
        baseBox(b+4.8,street+.15,a+.86,1.95,.39,1.04,'#707b80',{mat:'trafficX'});
        baseBox(b+5.73,street+.31,a+.86,.12,.13,.73,'#ffbf8a',{glow:.69,mat:'trafficX'});
      }

  }
}


/* Floor 48. All furnishings are built at room scale, with the street below y=0. */
function buildPenthouse(g) {
  const wood = {mat:"wood"}, fabric = {mat:"fabric"}, metal = {mat:"metal"}, stone = {mat:"stone"};
  const iron = "#323b45", graphite = "#23303a", brass = "#b88654", walnut = "#754833";
  const linen = "#e0d8c7", porcelain = "#e8e3d8";
  const plaster = {mat:"plaster"}, oak = {mat:"oak"}, creamLinen = {mat:"linen"};
  const brassMetal={mat:"brass"}, marble={mat:"marble"}, leather={mat:"leather"};
  const round=(x,y,z,w,h,d,r,c,o)=>g.roundBox(x,y,z,w,h,d,r,c,o);
  const sheet=(rows,cols,f,c,o)=>g.surface(rows,cols,f,c,o);
  const box = (x,y,z,w,h,d,c,o) => g.box(x,y,z,w,h,d,c,o);
  const cyl = (x,y,z,rt,rb,h,n,c,o) => g.cyl(x,y,z,rt,rb,h,n,c,o);
  const orb = (x,y,z,w,h,d,c,o) => g.ball(x,y,z,w,h,d,c,o);
  const rod = (a,b,r,c,o) => g.beam(a,b,r,c,o);
  const amber = {glow:0.75}, blueLight = {glow:0.84};
  const pick = a => a[Math.floor(g.rand()*a.length)];
  const coverColors = ["#2c5659","#ce7b4d","#b09a74","#323e49","#d1c9a9","#935742"];

  function book(x,y,z,w,h,d,c,angle=0) {
    const rotate = {ry:angle};

const soundscape = (() => {

    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return false;

      ctx = new Audio({latencyHint:'interactive'});
      master = ctx.createGain();
      master.gain.value = floor;
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -13;
      limiter.knee.value = 12;
      limiter.ratio.value = 3;
      master.connect(limiter);
      limiter.connect(ctx.destination);

      // Early wall reflections give close sounds an address in the apartment.
      roomSend = ctx.createGain();
      roomSend.gain.value = 0.17;

        roomSend.connect(delay).connect(dark).connect(level);

      }
      // Filtering one long shared noise sample avoids allocating on every footstep.
      noise = ctx.createBuffer(1,Math.round(ctx.sampleRate*3.13),ctx.sampleRate);
      const samples = noise.getChannelData(0);
      for (let i=0;i<samples.length;i++) samples[i] = range(-1,1);

      if (ctx) ctx.close().catch(()=>{});

      return false;

    if (!ctx.createStereoPanner) { source.connect(dest); return null; }

    source.onended=()=>{ for(const n of [source,after,gain,panner,reflections]) if(n)n.disconnect(); };
    if(source.buffer) source.start(t,range(0,2.6)); else source.start(t);

  function retireScene() {

  // The same four pitches come home in a different voicing.
  function signature(farm,dest,volume=1) {
    const freqs=farm?[220,329.628,369.994,293.665]:[293.665,369.994,329.628,220];
    const offsets=farm?[0,.37,.86,1.65]:[0,.51,.80,1.55];
    freqs.forEach((f,i)=>{
      const t=ctx.currentTime+.16+offsets[i],side=(i-1.5)*.14;
      tapTone(t,f*1.001,f,1.50,.064*volume,side,'sine',.015,dest,.68);
      tapTone(t,f*2.002,f*1.998,.62,.020*volume,side,'sine',.008,dest,.64);
      tapTone(t,f*3.991,f*3.986,.24,.008*volume,side,'sine',.007,dest,.60);
    });
  }
  function birds(s) {
    const t=ctx.currentTime+.05, root=range(1650,2480), side=range(-.86,.86);
    const phrase=Math.random()<.48?[[0,1,1.38,.10],[.15,1.22,.89,.19],[.43,1.08,1.32,.11]]:
      [[0,.97,1.27,.09],[.13,1.07,1.39,.09],[.29,1.37,.94,.21]];
    for(const [delay,start,end,length] of phrase){
      const o=oscillator('sine',root*start);
      o.frequency.setValueAtTime(root*start,t+delay);
      o.frequency.exponentialRampToValueAtTime(root*end,t+delay+length*.57);
      o.frequency.exponentialRampToValueAtTime(root*end*.94,t+delay+length);
      voice(o,t+delay,length,.025,range(.019,.037),side,null,s.bus);
    }

  function woodCreak(s) {
    const t=ctx.currentTime+.02, base=range(122,172), side=range(-.55,.55);
    for(let i=0;i<4;i++) {
      const dt=[0,.055,.147,.294][i], f=base*(1+i*.033);
      tapTone(t+dt,f,f*.91,.14,.019/(1+i*.17),side,'triangle',.03,s.bus,.42);

  function cityPass(s) {
    const length=range(3.5,6.8), t=ctx.currentTime+.03, side=Math.random()<.5?-1:1;
    const p=rustle(t,range(210,440),.69,length,length*.42,range(.043,.072),side*.48,s.bus);
    if(p)p.pan.linearRampToValueAtTime(-side*.48,t+length);
    if(Math.random()<.22){
      for(const f of [223,282]){
        tapTone(t+length*.47,f,f*.984,.49,.008,side*.36,'triangle',.11,s.bus);
      }
    }
  }
  function nextEvent(s,first=false) {
    const farm=s.world==='farm';
    timer=setTimeout(()=>{
      if(!enabled || hidden || scene!==s || ctx.state!=='running')return;
      if(farm){
        if(Math.random()<.76)birds(s);else woodCreak(s);
        s.wind.gain.setTargetAtTime(range(.045,.115),ctx.currentTime,1.7);
      }else cityPass(s);

    },1000*(first?range(2.2,4.6):farm?range(4,12):range(8,20)));
  }
  function startScene(playTheme) {
    if(!enabled || hidden || !ctx || ctx.state!=='running' || scene?.world===location)return;
    retireScene();
    const s=scene={world:location,bus:ctx.createGain(),sources:[]};
    s.bus.gain.value=floor; s.bus.connect(master); ramp(s.bus.gain,1,1.1);
    if(location==='farm'){

      bedTone(s,noiseSource(),filter('lowpass',225),.14,-.46);

      bedTone(s,oscillator('sine',73.4),filter('lowpass',175),.011,.14);
      bedTone(s,oscillator('sine',147.1),filter('lowpass',175),.004,.18);
    }
    if(playTheme)signature(location==='farm',s.bus,.75);
    nextEvent(s,true);
  }

  // Blue Sugar Tin. A sixteen-bar F-major ballad played a little behind the beat.
  // Each melody entry is [beat, MIDI pitch, beats held]. The rests belong to the tune.
  const recordBars=[
    [41,[52,57,60,67],[[.68,69,.56],[1.6,72,.72],[2.65,74,1.06]]],
    [38,[53,57,60,64],[[.12,72,1.05],[1.65,69,.50],[2.3,65,1.15]]],
    [43,[53,58,62,69],[[.62,67,.62],[1.65,70,.46],[2.34,69,.64],[3.30,65,.47]]],
    [36,[52,58,62,69],[[.1,64,1.69],[3.23,67,.42]]],
    [45,[53,57,60,67],[[.12,69,.95],[1.63,72,.51],[2.35,76,1.23]]],
    [34,[53,57,62,65],[[.12,74,.95],[1.62,72,.55],[2.62,69,1.1]]],
    [35,[53,56,62,65],[[.58,68,.67],[1.62,71,.59],[2.65,74,.95]]],
    [36,[53,58,62,67],[[.12,72,1.62],[2.68,67,.5],[3.38,64,.39]]],
    [33,[52,55,60,64],[[.66,67,.46],[1.34,69,.62],[2.30,72,1.32]]],
    [38,[54,60,63,69],[[.12,75,.92],[1.64,72,.52],[2.42,69,1.19]]],
    [43,[53,58,62,69],[[.14,70,.87],[1.47,67,.63],[2.65,65,.47],[3.36,62,.45]]],
    [36,[52,58,62,69],[[.14,64,1.47],[2.65,67,.45],[3.35,70,.44]]],
    [41,[52,57,60,67],[[.12,69,.88],[1.64,72,.52],[2.36,74,1.38]]],
    [38,[53,57,60,64],[[.12,72,.92],[1.62,69,.63],[2.46,65,1.03]]],
    [43,[53,58,62,69],[[.14,67,1.25],[1.98,62,.75],[3.14,65,.62]]],
    [36,[52,58,62,69],[[.12,64,1.20],[1.96,62,.54],[2.69,60,.93]]]
  ];
  function makeScore() {
    const events=[];
    recordBars.forEach(([root,voicing,melody],bar)=>{
      const add=(beat,kind,pitch,duration,level)=>events.push({time:(bar*4+beat)*beatSeconds,kind,pitch,length:duration*beatSeconds,level});
      for(const [beat,pitch,length] of melody)add(beat,'keys',pitch,length,.33);
      const changes=[[.02,2.12],[2.70,.73],[3.69,.26]];
      const entries=bar%4===3?[changes[0],changes[2]]:bar%2?[[.66,1.50],[2.42,.89]]:[changes[0],changes[1]];
      for(const [at,len] of entries)voicing.forEach((pitch,j)=>add(at+j*.012,'keys',pitch,len,.12+j*.007));
      add(.008,'bass',root,1.61,.70);
      add(2.028,'bass',bar%4===2?root+3:root+7,bar%4===3?.79:1.25,.55);
      if(bar%4===3)add(3.33,'bass',recordBars[(bar+1)%16][0]-1,.51,.42);
      add(.04,'sweep',0,.7,.048); add(1.04,'brush',0,.34,.075);
      add(2.05,'sweep',0,.70,.040);add(3.05,'brush',0,.30,.064);
      if(bar%4===1)add(3.68,'brush',0,.20,.038);
    });
    return events.sort((a,b)=>a.time-b.time);
  }
  function makeInstruments() {
    const hz=22050;
    function build(seconds,sample) {
      const b=ctx.createBuffer(1,Math.ceil(seconds*hz),hz), data=b.getChannelData(0);
      for(let n=0;n<data.length;n++)data[n]=sample(n/hz,n);
      return b;
    }
    // Tines have a brief, bright attack above a slowly drifting pair of fundamentals.
    const keys=build(3.5,t=>{
      const phase=2*Math.PI*220*t, strike=Math.exp(-t*8.1), fade=Math.exp(-t*1.25);
      const body=Math.sin(phase+.13*strike*Math.sin(phase*2.003))+.18*Math.sin(phase*1.0013);
      return (1-Math.exp(-t*200))*fade*(.54*body+.19*Math.sin(phase*2.001)*Math.exp(-t*1.4)+.13*Math.sin(phase*4.006)*strike);
    });

    const string=new Float32Array(Math.round(hz/82.407));
    for(let i=0;i<string.length;i++)string[i]=range(-1,1);
    const bass=build(3.6,(t,n)=>{
      const pos=n%string.length, s=string[pos];
      string[pos]=.4978*(s+string[(pos+1)%string.length]);
      const p=2*Math.PI*82.407*t;
      return (1-Math.exp(-t*100))*(.80*s+.44*Math.sin(p)*Math.exp(-t*1.95)+.15*Math.sin(2*p+.1)*Math.exp(-t*4.1));

  function playRecordNote(d,event,t) {
    const {kind,pitch,length,level}=event;
    if(kind==='sweep'||kind==='brush'){
      const sweeping=kind==='sweep';
      rustle(t,range(sweeping?980:1850,sweeping?1350:2460),.8,length,sweeping?.19:.024,level,0,d.input);
      return;
    }
    const source=ctx.createBufferSource(),env=ctx.createGain(),bass=kind==='bass';
    source.buffer=instruments[kind];
    source.playbackRate.value=Math.pow(2,(pitch-(bass?40:57))/12);
    source.connect(env).connect(d.input);
    const velocity=level*range(.92,1.035);
    env.gain.setValueAtTime(velocity,t);
    env.gain.setValueAtTime(velocity,t+length);
    env.gain.exponentialRampToValueAtTime(floor,t+length+(bass?.19:.27));
    source.onended=()=>{source.disconnect();env.disconnect();};

  }
  function scheduleRecord(d) {
    if(deck!==d)return;
    // Look ahead only a little: movement and lifting the stylus remain responsive.
    const now=ctx.currentTime,until=now+.3;
    while(d.origin+score[d.index].time<until){
      const event=score[d.index],t=d.origin+event.time;
      if(t>=now-.02)playRecordNote(d,event,Math.max(now+.001,t));

    }
    recordTimer=setTimeout(()=>scheduleRecord(d),140);
  }
  function positionRecord(force=false) {
    if(!deck)return;
    const now=ctx.currentTime;
    if(!force && now-deck.positionAt<.04)return;
    deck.positionAt=now;
    const dx=-5.7-ear.x,dz=2.42-ear.z,dist=Math.hypot(dx,dz);
    const right=(Math.cos(ear.yaw)*dx+Math.sin(ear.yaw)*dz)/Math.max(.45,dist);
    if(deck.pan)deck.pan.pan.setTargetAtTime(Math.max(-.86,Math.min(.86,right*.88)),now,.065);

  function pauseRecord(reset=false) {

      recordOffset=((ctx.currentTime-d.origin)%recordLength+recordLength)%recordLength;
      ramp(d.input.gain,floor,.065);
      try{d.vinyl.stop(ctx.currentTime+.09);}catch{}
      setTimeout(()=>{for(const n of [d.input,d.eq,d.level,d.pan,d.vinyl,d.dust,d.dustLevel])if(n)n.disconnect();},150);
    }

  }
  function syncRecord() {
    if(!recordWanted || !enabled || hidden || location!=='city' || ctx?.state!=='running'){
      pauseRecord();return;
    }
    if(deck)return;
    instruments=instruments||makeInstruments();score=score||makeScore();
    const d=deck={input:ctx.createGain(),eq:filter('lowpass',5400),level:ctx.createGain(),positionAt:-1};
    d.input.gain.value=floor;d.input.connect(d.eq);d.pan=pan(d.eq,d.level,0);
    d.level.gain.value=floor;d.level.connect(master);d.level.connect(roomSend);
    d.dust=filter('bandpass',2600,.59);d.dustLevel=ctx.createGain();d.dustLevel.gain.value=.013;
    d.vinyl=noiseSource();d.vinyl.connect(d.dust).connect(d.dustLevel).connect(d.input);d.vinyl.start();
    d.origin=ctx.currentTime+.06-recordOffset;
    d.index=score.findIndex(e=>e.time>=recordOffset);
    if(d.index===-1){d.index=0;d.origin+=recordLength;}
    ramp(d.input.gain,1,.10);positionRecord(true);scheduleRecord(d);
  }

  function clearUnlock() {
    document.removeEventListener('pointerdown',gesture);
    document.removeEventListener('keydown',gesture);
    unlocking=false;
  }
  function armUnlock() {
    if(unlocking)return;
    document.addEventListener('pointerdown',gesture,{passive:true});
    document.addEventListener('keydown',gesture);
    unlocking=true;
  }
  function gesture(){if(enabled && !hidden)wake();}
  function wake(theme=false) {
    if(!enabled || hidden || (!ctx && !makeAudio()))return;
    clearTimeout(napTimer);
    const finish=()=>{
      if(!enabled || hidden || ctx.state!=='running')return;
      clearUnlock(); ramp(master.gain,.70,.17); startScene(theme);syncRecord();
    };
    if(ctx.state==='running'){finish();return;}
    armUnlock();ctx.resume().then(finish).catch(()=>{});
  }
  function quiet() {
    clearUnlock(); retireScene();pauseRecord();
    if(!ctx)return;
    ramp(master.gain,floor,.12);
    clearTimeout(napTimer);
    napTimer=setTimeout(()=>{if(!enabled||hidden)ctx.suspend().catch(()=>{});},170);
  }
  return {
    record(playing) {
      recordWanted=!!playing;
      if(!recordWanted){pauseRecord(true);return;}
      syncRecord();
    },
    listener(x,z,yaw) {
      if(!Number.isFinite(x)||!Number.isFinite(z)||!Number.isFinite(yaw))return;
      ear.x=x;ear.z=z;ear.yaw=yaw;positionRecord();
    },
    enable(on,world=location) {
      location=normalize(world); const prior=enabled; enabled=!!on;
      if(!enabled){quiet();return;}
      wake(!prior);
    },
    world(world) {
      const next=normalize(world);if(next===location)return;
      location=next; lastStep=-10; if(enabled&&!hidden)wake(true);
    },
    suspend(value) {
      hidden=!!value;
      if(hidden)quiet();else if(enabled)wake(false);
    },
    step(world,sprint=false) {
      if(!enabled || hidden || ctx?.state!=='running')return;
      const t=ctx.currentTime, min=sprint?.275:.39;
      if(t-lastStep<min)return;
      lastStep=t; const foot=++stepNumber%2?1:-1, side=foot*.16, weight=sprint?1.22:1;
      if(normalize(world)==='farm'){
        tapTone(t,range(67,87),41,.12,.084*weight,side,'sine',.011,master,0);
        rustle(t,range(480,800),.72,.15,.016,.13*weight,side);
        rustle(t+.035,range(1250,2050),.80,.10,.023,.065*weight,side);
      }else{
        tapTone(t,range(95,126),54,.115,.095*weight,side,'sine',.005,master,.8);
        tapTone(t+.013,foot>0?214:188,foot>0?196:172,.074,.025,side,'triangle',.008,master,.72);
        rustle(t,range(850,1300),.72,.061,.004,.088*weight,side,master,.65);
        rustle(t+.061,range(450,650),.8,.072,.009,.042*weight,-side,master,.45);
      }
    },
    cue(name) {
      if(!enabled || hidden || ctx?.state!=='running')return;
      const t=ctx.currentTime;
      if(lastCue===name&&t-cueAt<.13)return;
      lastCue=name;cueAt=t;
      if(name==='sleep'){
        for(const [delay,f] of [[0,220],[.23,164.814],[.57,146.832]])tapTone(t+delay,f,f,1.15,.044,-.13,'sine',.055);
      }else if(name==='water'||name==='watering'){
        rustle(t,2190,.68,.76,.09,.12,.10);
        for(let i=0;i<7;i++){
          const f=range(540,1190);
          tapTone(t+.11+i*.084,f*.82,f,.075,range(.013,.030),range(-.18,.22),'sine',.006,master,0);
        }
      }else if(name==='harvest'||name==='plant'){
        rustle(t,range(970,1390),.70,.28,.035,.13,.03);
        rustle(t+.08,2660,.98,.13,.011,.056,-.04);
        if(name==='harvest')tapTone(t+.12,391.995,391.995,.44,.032,.12,'sine',.012);
      }else if(name==='trade'||name==='buy'||name==='sell'){
        tapTone(t,493.883,493.883,.12,.037,.025,'sine');
        const f=name==='sell'?391.995:659.255;
        tapTone(t+.095,f,f,.19,.028,.11,'sine');
      }else if(name==='repair'){
        for(const dt of [0,.19,.43]){
          tapTone(t+dt,range(118,145),72,.16,.11,-.15,'triangle',.004);
          rustle(t+dt,1990,.68,.09,.003,.09,-.14);
        }
      }else{
        rustle(t,1120,.75,.07,.005,.04,.035,master,.36);
      }
    }
  };
})();

function spark(a,positive,big=false){
 const W=big?490:74,H=big?108:28,pad=3,min=Math.min(...a),max=Math.max(...a),diff=Math.max(max-min,.01);

}
function syncHint(){
 const s=modal||travelBusy?null:chooseFocus();if(aimed?.key!==s?.key){aimed=s;$('#station-hint').innerHTML=s?'<button id="use-object"><kbd>E</kbd>'+s.label+'</button>':'';const b=$('#use-object');if(b)b.onclick=()=>activate(s.key)}$('#viewport').classList.toggle('has-focus',!!s)
}
function useFocused(){if(aimed){activate(aimed.key);return}const near=stations().map(s=>[Math.hypot(player.x-s.walk[0],player.z-s.walk[1]),s]).sort((a,b)=>a[0]-b[0])[0];if(near&&near[0]<1.2)activate(near[1].key);else toast('Face a nearby object to use it. Tab opens the dashboard.')}
function syncCamera(){if(!renderer)return;renderer.setPose(player.x,player.z,player.yaw,player.pitch,1.66+bob)}
function refreshPlace(){
 if(!renderer)return;renderer.weather=dispatch().sky;renderer.build(state.world==='farm',state.plots,state.story);renderer.fov=state.fov||70;renderer.quality=state.quality||2;syncCamera();renderer.render();syncHint()
}
function spawnPose(){return state.world==='city'?{x:1.18,z:3.43,yaw:-.22,pitch:-.075}:{x:-1.72,z:6.63,yaw:.04,pitch:-.10}}
function setupWorld(restore=false){
 path=[];aimed=null;arrival=null;keys.clear();bob=0;player=spawnPose();const saved=state.pose;
 if(restore&&saved?.world===state.world&&[saved.x,saved.z,saved.pitch,saved.yaw].every(Number.isFinite)&&canWalk(saved.x,saved.z))Object.assign(player,{x:saved.x,z:saved.z,yaw:saved.yaw,pitch:bound(saved.pitch,-1.28,1.28)});
 soundscape.world(state.world);updateHUD();refreshPlace();$('#station-hint').innerHTML='';aimed=null;syncHint();soundscape.record?.(state.recordOn&&state.world==='city')
}
function rememberPose(){state.pose={...player,world:state.world}}
function travelSequence(){
 if(travelBusy)return;travelBusy=true;releaseLook();closeDialog();const t=$('#transition'),going=state.world==='city';t.querySelector('i').innerHTML=icon(going?'moon':'tower');t.querySelector('strong').textContent=going?'The city falls quiet.':'The last train to Eastbank.';t.classList.add('in');soundscape.cue(going?'sleep':'interact');
 setTimeout(()=>{travelToWorld();state.farmMinute=390;ripen();setupWorld();rememberPose();persist();t.querySelector('strong').textContent=going?'Morning at Willow Farm':'Evening on the 48th floor';setTimeout(()=>{t.classList.remove('in');travelBusy=false;syncHint()},420)},470)
}
function look(dx,dy){player.yaw+=dx*.00225*(state.sensitivity||1);player.pitch=bound(player.pitch-dy*.00215*(state.sensitivity||1),-1.36,1.36);syncCamera()}
function lockMouse(){if(modal||travelBusy)return;const el=$('#scene');el.focus({preventScroll:true});if(typeof el.requestPointerLock==='function'){try{const p=el.requestPointerLock();p?.catch(()=>toast('Drag to look around. Arrow keys also turn your view.'))}catch{toast('Drag to look around. Arrow keys also turn your view.')}}else toast('Drag to look around. Arrow keys also turn your view.')}
function wireWorld(){
 const canvas=$('#scene'),pad=$('#touch-pad');let drag=null,joy=null;
 $('#enter-look').onclick=lockMouse;$('#touch-use').onclick=useFocused;
 const clearStick=()=>{joy=null;stick=[0,0];pad.firstChild.style.transform='translate(-50%,-50%)'};
 function updateStick(e){const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.38),dz=(e.clientY-r.top-r.height/2)/(r.height*.38),len=Math.max(1,Math.hypot(dx,dz));stick=[dx/len,dz/len];pad.firstChild.style.transform='translate(calc(-50% + '+stick[0]*23+'px),calc(-50% + '+stick[1]*23+'px))';path=[];arrival=null}
 pad.addEventListener('pointerdown',e=>{e.preventDefault();joy=e.pointerId;pad.setPointerCapture(joy);updateStick(e)});pad.addEventListener('pointermove',e=>{if(joy===e.pointerId)updateStick(e)});for(const k of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(k,clearStick);
 canvas.addEventListener('pointerdown',e=>{if(modal||travelBusy)return;if($('#sidebar').classList.contains('open')){showPanel(false);return}if(state.sound)soundscape.enable(true,state.world);canvas.focus({preventScroll:true});
 if(document.pointerLockElement===canvas){if(aimed)useFocused();return}drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,type:e.pointerType};canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||document.pointerLockElement===canvas)return;look(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY});
 canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const tapped=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<4,type=drag.type;drag=null;if(tapped&&type==='mouse')lockMouse()});canvas.addEventListener('pointercancel',()=>{drag=null});
 document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&!modal&&!travelBusy)look(e.movementX,e.movementY)});document.addEventListener('pointerlockchange',()=>{const locked=document.pointerLockElement===canvas;document.body.classList.toggle('mouse-locked',locked);$('#enter-look').textContent=locked?'Esc to release mouse':'Enable mouse look';if(!locked)keys.clear()});
 const movement=['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown','shift'];
 window.addEventListener('keydown',e=>{if(modal||travelBusy||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='tab'&&(!e.repeat)&&(document.activeElement===canvas||document.activeElement===document.body||document.pointerLockElement)){e.preventDefault();showPanel(!$('#sidebar').classList.contains('open'));return}if(k==='escape'){showPanel(false);return}if($('#sidebar').classList.contains('open'))return;
 if(movement.includes(k)){e.preventDefault();keys.add(k);path=[];arrival=null}else if(k==='e'&&!e.repeat){e.preventDefault();useFocused()}});
 window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();clearStick()});document.addEventListener('visibilitychange',()=>{keys.clear();clearStick();framePrev=undefined;soundscape.suspend(document.hidden);if(document.hidden){rememberPose();persist()}});
 window.addEventListener('pagehide',()=>{rememberPose();persist()});window.addEventListener('resize',()=>{if(renderer)renderer.dirty=true});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();dirtyAfterRestore=true;toast('Restoring graphics…')});canvas.addEventListener('webglcontextrestored',()=>{renderer=new Renderer(canvas);dirtyAfterRestore=false;refreshPlace()})
}
function walkFrame(dt){
 if(!renderer||modal||travelBusy||$('#sidebar').classList.contains('open'))return;let dx=0,dz=0;
 const turn=Number(keys.has('arrowright'))-Number(keys.has('arrowleft')),tilt=Number(keys.has('arrowup'))-Number(keys.has('arrowdown'));if(turn||tilt){player.yaw+=turn*dt*1.75;player.pitch=bound(player.pitch+tilt*dt*1.12,-1.36,1.36);syncCamera()}
 const h=Number(keys.has('d'))-Number(keys.has('a'))+stick[0],v=Number(keys.has('w'))-Number(keys.has('s'))-stick[1],sprint=keys.has('shift');
 if(h||v){const rate=state.world==='farm'?(sprint?4.9:2.85):(sprint?3.8:2.35),l=Math.max(1,Math.hypot(h,v));dx=(Math.cos(player.yaw)*h+Math.sin(player.yaw)*v)/l*dt*rate;dz=(Math.sin(player.yaw)*h-Math.cos(player.yaw)*v)/l*dt*rate}
 else if(path.length){const [x,z]=path[0],dist=Math.hypot(x-player.x,z-player.z),step=Math.min(dist,dt*4.0);if(dist>.001){dx=(x-player.x)/dist*step;dz=(z-player.z)/dist*step;guideLook(Math.atan2(dx,-dz),-.055,Math.min(1,dt*6))}if(dist<=step+.001)path.shift()}
 const x=player.x,z=player.z;if(canWalk(x+dx,z))player.x+=dx;if(canWalk(player.x,z+dz))player.z+=dz;const traveled=Math.hypot(player.x-x,player.z-z);
 if(traveled>.0001){phase+=traveled*(sprint?7.4:8.3);bob=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.sin(phase)*.018;soundscape.step(state.world,sprint);syncCamera()}
 else if(Math.abs(bob)>.001){bob*=.62;syncCamera()}
 if(!path.length&&arrival){const key=arrival;arrival=null;activate(key)}
}
function frame(now){
 const dt=framePrev===undefined?0:Math.min((now-framePrev)/1000,.12);framePrev=now;
 if(!document.hidden&&!dirtyAfterRestore){walkFrame(dt);ambientClock+=dt;simClock+=dt;quoteClock+=dt;
   if(renderer){soundscape.listener?.(player.x,player.z,player.yaw);renderer.clock=ambientClock;if(renderer.effect)renderer.dirty=true;if(!renderer.isSoftware&&ambientClock-lastAmb>.16&&!modal){renderer.dirty=true;lastAmb=ambientClock}if(renderer.render())syncHint()}
   if(simClock>=1){simClock=0;if(ripen()){persist();if(state.world==='farm')refreshPlace();updateHUD();if(modal==='plot')renderModal()}
     if(modal==='plot'&&$('#grow-time'))$('#grow-time').textContent=Math.max(0,Math.ceil((state.plots[selectedBed].ripeAt-Date.now())/1000))}
   if(quoteClock>=16&&modal!=='desk'&&!travelBusy){quoteClock=0;priceTick();if(state.world==='city')state.dayMinute=Math.min(1439,state.dayMinute+3);else state.farmMinute=Math.min(1080,(state.farmMinute||390)+3);rememberPose();persist();updateHUD();if(modal==='portfolio')renderModal()}
 }requestAnimationFrame(frame)
}
function boot(){wireUI();ripen();try{renderer=new Renderer($('#scene'))}catch(e){console.warn('Using the software 3D renderer:',e);const replacement=$('#scene').cloneNode(false);$('#scene').replaceWith(replacement);renderer=new SoftwareRenderer(replacement)}
 const wakeAudio=()=>{if(state.sound)soundscape.enable(true,state.world);if(state.recordOn&&state.world==='city')soundscape.record?.(true)};window.addEventListener('pointerdown',wakeAudio,{once:true,capture:true});window.addEventListener('keydown',wakeAudio,{once:true,capture:true});wireWorld();setupWorld(true);requestAnimationFrame(frame)}
boot();
</script>
</body></html>
