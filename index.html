<script>/* Lightweight flat-shaded mesh builder and shadow-mapped WebGL renderer. */
const V3 = {
  sub:(a,b)=>a.map((n,i)=>n-b[i]), dot:(a,b)=>a.reduce((s,n,i)=>s+n*b[i],0),
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  unit:a=>a.map(n=>n/(Math.hypot(...a)||1))
};
const bound=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
function viewMatrix(eye,at){
  const z=V3.unit(V3.sub(eye,at)), x=V3.unit(V3.cross([0,1,0],z)), y=V3.cross(z,x);
  return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-V3.dot(x,eye),-V3.dot(y,eye),-V3.dot(z,eye),1];
}
function ortho(w,h,n,f){return [1/w,0,0,0,0,1/h,0,0,0,0,-2/(f-n),0,0,0,-(f+n)/(f-n),1]}
function matrixMult(a,b){const o=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o}
const colorMap=new Map(), matIds={plain:0,wood:1,fabric:2,stone:3,metal:4};
function rgb(col){
  if(colorMap.has(col))return colorMap.get(col);
  let s=col.replace('#','');if(s.length===3)s=[...s].map(c=>c+c).join('');
  const v=parseInt(s,16),a=[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255];colorMap.set(col,a);return a
}
function rotator(o){
  if(!(o.rx||o.ry||o.rz))return v=>v;
  const a=Math.cos(o.rx||0),b=Math.sin(o.rx||0),c=Math.cos(o.ry||0),d=Math.sin(o.ry||0),e=Math.cos(o.rz||0),f=Math.sin(o.rz||0);
  return ([x,y,z])=>{const t=y*a-z*b,u=y*b+z*a,v=x*c+u*d;return [v*e-t*f,v*f+t*e,-x*d+u*c]}
}
class Geometry{
  constructor(seed=7){this.seed=seed;this.data=[];this.rand=this.rand.bind(this)}
  rand(){this.seed=(1664525*this.seed+1013904223)>>>0;return this.seed/4294967296}
  polygon(points,col,o={},norm=null){
    const n=norm||V3.unit(V3.cross(V3.sub(points[1],points[0]),V3.sub(points[2],points[0]))), c=rgb(col), m=matIds[o.mat]||0, glow=o.glow||0;
    for(let i=1;i<points.length-1;i++)for(const j of [0,i,i+1])this.data.push(...points[j],...n,...c,m,glow)

  function shell(x, z, w, d, top, style, distance, palette) {
    box(x,(ground+top)/2,z,w,top-ground,d,palette[0]);

  function building(x,z,w,d,top,distance,palette,style) {

  {

    const pixel=.14, total=(5+1+3+3+3)*pixel;
    const signZ=z+d*.36, signY=top+.83;
    for (const dx of [-total*.4,total*.4]) {

  }

  // A mid-distance radio building breaks up the mechanical roof silhouettes.
  {
    const [x,z,w,d]=specials[2], top=-7.2, p=facades[1];
    shell(x,z,w,d,top,1,24,p);

}

 state.stocks.forEach((q,i)=>{if(overnight)q.open=q.price;const s=STOCKS[i],move=(Math.random()+Math.random()-1)*s.vol*(overnight?2.5:1)+mood+s.drift;q.price=roundCash(Math.max(3,q.price*(1+move)));q.history.push(q.price);q.history=q.history.slice(-42)})

 state.cash=roundCash(state.cash+(buy?-cost:cost));state.goals.trade=true;const msg=(buy?'Bought ':'Sold ')+qty+' '+STOCKS[i].id+' at '+dollars(q.price)+'.';logEvent(msg,'chart');persist();return msg

   if(renderer&&((moving&&avatarTime>1/30)||moving!==lastMoving)){renderer.avatar(player.x,player.z,player.yaw,phase,moving);avatarTime=0}lastMoving=moving;
   if(renderer&&renderer.render())projectMarkers();simClock+=dt;quoteClock+=dt;
   if(simClock>=1){simClock=0;if(ripen()){persist();if(state.world==='farm')refreshPlace();updateHUD();if(modal==='plot')renderModal()}
     if(modal==='plot'&&$('#grow-time'))$('#grow-time').textContent=Math.max(0,Math.ceil((state.plots[selectedBed].ripeAt-Date.now())/1000))}
   if(quoteClock>=16&&state.world==='city'&&modal!=='desk'&&!travelBusy){quoteClock=0;priceTick();state.dayMinute=Math.min(1439,state.dayMinute+3);persist();updateHUD();if(modal==='portfolio')renderModal()}
 }requestAnimationFrame(frame)
}
function boot(){wireUI();ripen();try{renderer=new Renderer($('#scene'));renderer.quality=state.quality||2}catch(e){console.warn('Switching to software rendering:',e);const replacement=$('#scene').cloneNode(false);$('#scene').replaceWith(replacement);renderer=new SoftwareRenderer(replacement);renderer.quality=1}
 wireWorld();setupWorld();requestAnimationFrame(frame)}
boot();
</script>
